name: Build Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Cache React build
      uses: actions/cache@v4
      with:
        path: build
        key: ${{ runner.os }}-build-${{ hashFiles('src/**/*', 'public/**/*', 'package*.json') }}
        restore-keys: |
          ${{ runner.os }}-build-
    
    - name: Cache Electron Builder
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
        key: ${{ runner.os }}-electron-${{ hashFiles('package*.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build React app
      run: npm run build
      
    - name: Build Electron app (no publish)
      run: npm run dist
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-build-windows
        path: |
          dist/*.exe
        retention-days: 7